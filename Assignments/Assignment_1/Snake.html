<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game - Blue & Red Balls</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2.2rem;
      color: #4CAF50;
    }

    .scoreboard {
      display: flex;
      gap: 20px;
      font-size: 1.2rem;
      margin-bottom: 15px;
      background: #1e1e1e;
      padding: 10px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .scoreboard div {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .blue-text { color: #3b82f6; }
    .red-text { color: #ef4444; }

    .game-container {
      position: relative;
    }

    canvas {
      border: 3px solid #333;
      border-radius: 10px;
      background-color: #181818;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 400px;
      height: 400px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .overlay h2 {
      font-size: 2rem;
      color: #ef4444;
      margin-bottom: 10px;
    }

    .overlay p {
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    .btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s ease-in-out;
    }

    .btn:hover {
      background-color: #45a049;
    }

    .controls-info {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #888;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <h1>Snake Game</h1>

  <div class="scoreboard">
    <div>Score: <strong id="score">0</strong></div>
    <div>Length: <strong id="length">3</strong></div>
    <div class="blue-text">🔵 <span id="blue-count">0</span></div>
    <div class="red-text">🔴 <span id="red-count">0</span></div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- Start Overlay -->
    <div id="startScreen" class="overlay">
      <h2 style="color: #4CAF50;">Snake Game</h2>
      <p>Eat 🔵 to grow & score | Avoid 🔴</p>
      <button class="btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverScreen" class="overlay hidden">
      <h2>Game Over!</h2>
      <p id="gameOverReason">You hit the boundary!</p>
      <button class="btn" onclick="startGame()">Play Again</button>
    </div>
  </div>

  <div class="controls-info">
    Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to Move
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const lengthEl = document.getElementById('length');
    const blueCountEl = document.getElementById('blue-count');
    const redCountEl = document.getElementById('red-count');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const gameOverReason = document.getElementById('gameOverReason');

    const gridSize = 20; // 20x20 grid (400 / 20 = 20 tiles)
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let dx = gridSize;
    let dy = 0;
    let blueBall = { x: 0, y: 0 };
    let redBall = { x: 0, y: 0 };
    let blueEaten = 0;
    let redEaten = 0;
    let gameInterval = null;
    let changingDirection = false;

    function startGame() {
      // Reset state
      snake = [
        { x: 10 * gridSize, y: 10 * gridSize },
        { x: 9 * gridSize, y: 10 * gridSize },
        { x: 8 * gridSize, y: 10 * gridSize }
      ];
      dx = gridSize;
      dy = 0;
      blueEaten = 0;
      redEaten = 0;
      changingDirection = false;

      updateScoreboard();
      spawnBalls();

      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, 100);
    }

    function gameLoop() {
      if (hasGameEnded()) return;

      changingDirection = false;
      clearCanvas();
      moveSnake();
      drawBalls();
      drawSnake();
    }

    function clearCanvas() {
      ctx.fillStyle = '#181818';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
      snake.forEach((part, index) => {
        // Head is bright green, body is darker green
        ctx.fillStyle = index === 0 ? '#4CAF50' : '#2E7D32';
        ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2);
      });
    }

    function drawBalls() {
      // Draw Blue Ball
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.arc(blueBall.x + gridSize / 2, blueBall.y + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw Red Ball
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(redBall.x + gridSize / 2, redBall.y + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      // Check Blue Ball Collision
      if (head.x === blueBall.x && head.y === blueBall.y) {
        blueEaten++;
        updateScoreboard();
        spawnBalls();
        // Do not pop tail, snake grows by 1
      } 
      // Check Red Ball Collision
      else if (head.x === redBall.x && head.y === redBall.y) {
        redEaten++;
        updateScoreboard();
        spawnBalls();
        // Pop twice to decrease length by 1
        snake.pop(); 
        snake.pop(); 
      } 
      // Regular Move
      else {
        snake.pop();
      }
    }

    function hasGameEnded() {
      const head = snake[0];

      // Boundary collision
      const hitLeftWall = head.x < 0;
      const hitRightWall = head.x >= canvas.width;
      const hitToptWall = head.y < 0;
      const hitBottomWall = head.y >= canvas.height;

      if (hitLeftWall || hitRightWall || hitToptWall || hitBottomWall) {
        endGame("You hit the boundary!");
        return true;
      }

      // Self collision
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          endGame("You hit yourself!");
          return true;
        }
      }

      // Length smaller than 1 collision (from eating red balls)
      if (snake.length < 1) {
        endGame("Snake became too small!");
        return true;
      }

      return false;
    }

    function endGame(reason) {
      clearInterval(gameInterval);
      gameOverReason.innerText = reason;
      gameOverScreen.classList.remove('hidden');
    }

    function spawnBalls() {
      blueBall = getRandomCoordinate();
      redBall = getRandomCoordinate();

      // Ensure red ball and blue ball don't spawn on top of each other
      while (redBall.x === blueBall.x && redBall.y === blueBall.y) {
        redBall = getRandomCoordinate();
      }
    }

    function getRandomCoordinate() {
      let coord;
      while (true) {
        coord = {
          x: Math.floor(Math.random() * tileCount) * gridSize,
          y: Math.floor(Math.random() * tileCount) * gridSize
        };
        // Ensure ball doesn't spawn on top of snake
        let isOnSnake = snake.some(part => part.x === coord.x && part.y === coord.y);
        if (!isOnSnake) break;
      }
      return coord;
    }

    function updateScoreboard() {
      const score = blueEaten - redEaten;
      scoreEl.innerText = score;
      lengthEl.innerText = snake.length;
      blueCountEl.innerText = blueEaten;
      redCountEl.innerText = redEaten;
    }

    // Key Listeners
    document.addEventListener('keydown', changeDirection);

    function changeDirection(event) {
      const keyPressed = event.key;
      if (changingDirection) return;

      const goingUp = dy === -gridSize;
      const goingDown = dy === gridSize;
      const goingRight = dx === gridSize;
      const goingLeft = dx === -gridSize;

      if ((keyPressed === 'ArrowLeft' || keyPressed === 'a' || keyPressed === 'A') && !goingRight) {
        dx = -gridSize;
        dy = 0;
        changingDirection = true;
      }
      if ((keyPressed === 'ArrowUp' || keyPressed === 'w' || keyPressed === 'W') && !goingDown) {
        dx = 0;
        dy = -gridSize;
        changingDirection = true;
      }
      if ((keyPressed === 'ArrowRight' || keyPressed === 'd' || keyPressed === 'D') && !goingLeft) {
        dx = gridSize;
        dy = 0;
        changingDirection = true;
      }
      if ((keyPressed === 'ArrowDown' || keyPressed === 's' || keyPressed === 'S') && !goingUp) {
        dx = 0;
        dy = gridSize;
        changingDirection = true;
      }
    }
  </script>
</body>
</html>
